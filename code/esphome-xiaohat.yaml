# This is a basic example for the XIAO ESP32C3 + XIAO-LOG HAT
# Temperature, humidity, light and battery voltage are sent to Home Assistant every 10 minutes
esphome:
  name: xiao-log
  friendly_name: XIAO-LOG
  on_boot:
    priority: 900
    then:
      - output.turn_on: switch_sensors

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key        # must be a valid base64 32-byte key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Xiao-Log Fallback Hotspot"
    password: !secret ap_password

captive_portal:

deep_sleep:
  run_duration: 20s
  sleep_duration: 10min

output:
  - platform: gpio
    pin: GPIO10
    id: switch_sensors

i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true
  id: bus_a

sensor:
  - platform: bh1750
    name: "Illuminance"
    update_interval: 3s
  - platform: sht4x
    temperature:
      name: "Temperature"
    humidity:
      name: "Relative Humidity"
    update_interval: 3s
  - platform: adc
    pin: GPIO3                  # ADC pin D1/A1
    name: "Battery Voltage"
    attenuation: 12db
    samples: 16
    update_interval: 3s
    filters:
      - multiply: 2.0           # divider ratio (R1+R2)/R2
